
<style>
  .gcw { padding: 2rem 1.75rem; font-family: var(--font-sans); max-width: 480px; margin: 0 auto; }
  .gcw-datetime { font-size: 15px; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
  .gcw-greeting { font-size: 46px; font-weight: 500; color: var(--color-text-primary); line-height: 1.15; margin-bottom: 24px; }
  .gcw-divider { width: 36px; height: 1.5px; background: var(--color-border-secondary); margin-bottom: 20px; }
  .gcw-settings { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .gcw-row { display: flex; align-items: center; gap: 10px; }
  .gcw-lbl { font-size: 12px; color: var(--color-text-tertiary); width: 72px; flex-shrink: 0; letter-spacing: 0.04em; text-transform: uppercase; }
  .gcw-row input[type=text] { flex: 1; font-size: 13px; }
  .gcw-row select { flex: 1; font-size: 13px; }
  .fmt-btns { display: flex; gap: 6px; }
  .fmt-btns button { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; }
  .fmt-btns button.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }
</style>

<div class="gcw" role="region" aria-label="Greeting clock widget">
  <h2 class="sr-only">Live date, time and personalised greeting</h2>
  <div class="gcw-datetime" id="gdt"></div>
  <div class="gcw-greeting" id="ggreet"></div>
  <div class="gcw-divider"></div>

  <div class="gcw-settings">
    <div class="gcw-row">
      <span class="gcw-lbl">Name</span>
      <input type="text" id="nameInput" value="Friend" placeholder="Your name" oninput="render()" />
    </div>
    <div class="gcw-row">
      <span class="gcw-lbl">Timezone</span>
      <select id="tzSel" onchange="render()"></select>
    </div>
    <div class="gcw-row">
      <span class="gcw-lbl">Format</span>
      <div class="fmt-btns">
        <button id="b12" class="active" onclick="setFmt(12)">12h</button>
        <button id="b24" onclick="setFmt(24)">24h</button>
      </div>
    </div>
  </div>
</div>

<script>
const ZONES=[["Pacific/Honolulu","(UTC-10) Hawaii"],["America/Los_Angeles","(UTC-8) Pacific"],["America/Denver","(UTC-7) Mountain"],["America/Chicago","(UTC-6) Central"],["America/New_York","(UTC-5) Eastern"],["America/Sao_Paulo","(UTC-3) São Paulo"],["Europe/London","(UTC+0) London"],["Europe/Paris","(UTC+1) Paris/Berlin"],["Europe/Helsinki","(UTC+2) Helsinki"],["Europe/Moscow","(UTC+3) Moscow"],["Asia/Dubai","(UTC+4) Dubai"],["Asia/Karachi","(UTC+5) Karachi"],["Asia/Kolkata","(UTC+5:30) Kolkata/Mumbai"],["Asia/Dhaka","(UTC+6) Dhaka"],["Asia/Bangkok","(UTC+7) Bangkok"],["Asia/Shanghai","(UTC+8) Singapore/Beijing"],["Asia/Tokyo","(UTC+9) Tokyo"],["Australia/Sydney","(UTC+10) Sydney"],["Pacific/Auckland","(UTC+12) Auckland"]];
const pad=n=>String(n).padStart(2,'0');
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
let fmt=12;

function setFmt(f){fmt=f;document.getElementById('b12').classList.toggle('active',f===12);document.getElementById('b24').classList.toggle('active',f===24);render();}

function greeting(h){
  if(h>=5&&h<12)return'Good morning';
  if(h>=12&&h<17)return'Good afternoon';
  if(h>=17&&h<21)return'Good evening';
  return'Good night';
}

function buildSelect(){
  const sel=document.getElementById('tzSel');
  let local=null;try{local=Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(e){}
  ZONES.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(v===local)o.selected=true;sel.appendChild(o);});
}

function render(){
  const tz=document.getElementById('tzSel').value||'UTC';
  const name=document.getElementById('nameInput').value.trim()||'Friend';
  const now=new Date();
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:fmt===12}).formatToParts(now);
  const get=t=>(parts.find(p=>p.type===t)||{}).value||'';
  const h24=new Intl.DateTimeFormat('en',{timeZone:tz,hour:'numeric',hour12:false}).format(now);
  const ap=get('dayPeriod');
  const timeStr=pad(parseInt(get('hour')))+':'+get('minute')+':'+get('second')+(fmt===12?' '+ap:'');
  document.getElementById('gdt').textContent=get('weekday')+', '+parseInt(get('day'))+' '+get('month')+' '+get('year')+' | '+timeStr;
  document.getElementById('ggreet').textContent=greeting(parseInt(h24))+', '+name+'.';
}

buildSelect();render();setInterval(render,1000);
</script>
