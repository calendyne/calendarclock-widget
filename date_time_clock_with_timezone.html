
<style>
  .cw { padding: 2rem 1.5rem; font-family: var(--font-sans); max-width: 420px; margin: 0 auto; }
  .clock-day { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 6px; text-align:center; }
  .clock-date { font-size: 17px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 16px; text-align:center; }
  .clock-time { font-size: 54px; font-weight: 400; color: var(--color-text-primary); letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; text-align:center; }
  .clock-ampm { font-size: 15px; color: var(--color-text-tertiary); margin-left: 5px; vertical-align: 9px; }
  .clock-ss { font-size: 26px; vertical-align: 8px; color: var(--color-text-secondary); }
  .divider { width: 32px; height: 1px; background: var(--color-border-tertiary); margin: 18px auto; }
  .tz-label { font-size: 12px; color: var(--color-text-tertiary); text-align:center; margin-bottom: 14px; letter-spacing:0.04em; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls select { flex: 1; font-size: 13px; }
  .controls button { font-size: 13px; white-space: nowrap; padding: 0 14px; }
  .fmt-toggle { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .fmt-toggle button { font-size: 12px; padding: 4px 14px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
  .fmt-toggle button.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }
  #sep { transition: opacity 0.15s; }
</style>

<div class="cw" role="region" aria-label="Customizable live clock">
  <h2 class="sr-only">Live clock with timezone selector</h2>

  <div class="fmt-toggle">
    <button id="btn12" class="active" onclick="setFmt(12)">12h</button>
    <button id="btn24" onclick="setFmt(24)">24h</button>
  </div>

  <div class="clock-day" id="wd"></div>
  <div class="clock-date" id="dt"></div>
  <div class="clock-time">
    <span id="hh"></span><span id="sep">:</span><span id="mm"></span><span class="clock-ss" id="ss"></span><span class="clock-ampm" id="ap"></span>
  </div>

  <div class="divider"></div>
  <div class="tz-label" id="tz-display"></div>

  <div class="controls">
    <select id="tz-select" aria-label="Select timezone"></select>
    <button onclick="resetTz()">Use local</button>
  </div>
</div>

<script>
const ZONES = [
  ["Pacific/Midway","(UTC-11) Midway Island"],["Pacific/Honolulu","(UTC-10) Hawaii"],
  ["America/Anchorage","(UTC-9) Alaska"],["America/Los_Angeles","(UTC-8) Pacific Time"],
  ["America/Denver","(UTC-7) Mountain Time"],["America/Chicago","(UTC-6) Central Time"],
  ["America/New_York","(UTC-5) Eastern Time"],["America/Caracas","(UTC-4) Caracas"],
  ["America/Sao_Paulo","(UTC-3) São Paulo"],["America/Noronha","(UTC-2) Mid-Atlantic"],
  ["Atlantic/Azores","(UTC-1) Azores"],["Europe/London","(UTC+0) London"],
  ["Europe/Paris","(UTC+1) Paris / Berlin"],["Europe/Helsinki","(UTC+2) Helsinki / Cairo"],
  ["Europe/Moscow","(UTC+3) Moscow"],["Asia/Dubai","(UTC+4) Dubai"],
  ["Asia/Karachi","(UTC+5) Karachi"],["Asia/Kolkata","(UTC+5:30) Mumbai / Kolkata"],
  ["Asia/Dhaka","(UTC+6) Dhaka"],["Asia/Bangkok","(UTC+7) Bangkok / Jakarta"],
  ["Asia/Shanghai","(UTC+8) Beijing / Singapore"],["Asia/Tokyo","(UTC+9) Tokyo / Seoul"],
  ["Australia/Sydney","(UTC+10) Sydney"],["Pacific/Noumea","(UTC+11) Noumea"],
  ["Pacific/Auckland","(UTC+12) Auckland"]
];

const pad = n => String(n).padStart(2,'0');
const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let fmt = 12;
let selTz = null;

function setFmt(f) {
  fmt = f;
  document.getElementById('btn12').classList.toggle('active', f===12);
  document.getElementById('btn24').classList.toggle('active', f===24);
}

function resetTz() {
  selTz = null;
  try { selTz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e){}
  const sel = document.getElementById('tz-select');
  for (let i=0; i<sel.options.length; i++) {
    if (sel.options[i].value === selTz) { sel.selectedIndex = i; break; }
  }
}

function buildSelect() {
  const sel = document.getElementById('tz-select');
  let localTz = null;
  try { localTz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e){}
  ZONES.forEach(([val, label]) => {
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = label;
    if (val === localTz) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => { selTz = sel.value; });
  selTz = sel.value;
}

function tick() {
  const tz = selTz || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const now = new Date();

  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz,
    weekday:'long', month:'long', day:'numeric', year:'numeric',
    hour:'numeric', minute:'2-digit', second:'2-digit', hour12: fmt===12
  }).formatToParts(now);

  const get = t => (parts.find(p=>p.type===t)||{}).value || '';
  const h = get('hour'), m = get('minute'), s = get('second'), ap = get('dayPeriod');
  const sec = parseInt(s);

  document.getElementById('wd').textContent = get('weekday');
  document.getElementById('dt').textContent = get('month') + ' ' + get('day') + ', ' + get('year');
  document.getElementById('hh').textContent = pad(parseInt(h));
  document.getElementById('mm').textContent = m;
  document.getElementById('ss').textContent = ':' + s;
  document.getElementById('ap').textContent = fmt===12 ? (ap||'') : '';
  document.getElementById('sep').style.opacity = sec % 2 === 0 ? '1' : '0.25';

  const tzName = ZONES.find(z=>z[0]===tz);
  document.getElementById('tz-display').textContent = tzName ? tzName[1].replace(/^\(UTC[^)]*\)\s*/,'') : tz.replace(/_/g,' ');
}

buildSelect();
tick();
setInterval(tick, 1000);
</script>
